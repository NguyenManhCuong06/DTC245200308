server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    timeout: 30s
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  # Container stdout/stderr, including Nginx access/error logs, discovered via Docker.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=gallery"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_id]
        regex: "(.*)"
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
    pipeline_stages:
      - docker: {}
      # When positions are rebuilt, Promtail re-reads old container logs. Loki
      # rejects entries older than the stream head ("entry too far behind"),
      # which only produces noise, so stale lines are dropped before shipping.
      - drop:
          older_than: 24h
          drop_counter_reason: stale_container_log

  # The application also writes structured JSON logs to /app/src/logs/app.log.
  - job_name: application-file
    static_configs:
      - targets: [localhost]
        labels:
          job: application
          container: web
          service: web
          __path__: /app/src/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            status_code: status_code
            method: method
            route: route
      - labels:
          level:
          status_code: