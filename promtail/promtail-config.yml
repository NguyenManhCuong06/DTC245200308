server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    timeout: 30s
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  # Docker JSON logs (including Nginx stdout/stderr) discovered through the Docker socket.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=gallery"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_log_path]
        target_label: __path__
    pipeline_stages:
      - docker: {}

  # The application also writes structured JSON logs to /app/src/logs/app.log.
  - job_name: application-file
    static_configs:
      - targets: [localhost]
        labels:
          job: application
          container: web
          service: web
          __path__: /app/src/logs/*.log