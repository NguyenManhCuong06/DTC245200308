server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_name]
        target_label: job

  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          container: nginx
          __path__: /logs/nginx/access.log

  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          container: nginx
          __path__: /logs/nginx/error.log

  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: app
          container: web
          __path__: /app/logs/*.log